- name: Generate release keystore if missing
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass android \
              -alias my-key-alias \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Release Test,O=App,C=IN"
          fi
          ls -la my-upload-key.jks

      - name: Build Release AAB
        run: gradle bundleRelease --no-configuration-cache
